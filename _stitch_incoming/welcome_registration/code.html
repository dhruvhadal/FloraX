};</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col w-full max-w-lg mx-auto px-gutter bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Hero Banner Section -->
<div class="relative w-full rounded-2xl overflow-hidden shadow-sm mt-2 border border-outline-variant/30">
<img alt="Indian farmer inspecting healthy crops in sunlit field" class="w-full h-44 object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCtUEji8Osyj2T4qk7RUDHVCQQ9yEtpoeD6hblhwGDh2o8y34jw79VRZ8m5oKB9NrX8mmZoGyvX2cRuy9rsbuq56CegMOMpYQiZm8R0Hh6nC-XyB3IVJ-5IWWplje7RgpgigYUNzU-IzT4lhXJszH67gBJFkBc-mIUPAumUdq_btkyQZtsmAvZXbBwN89wJKUAlg7S_3uy9-mUhRuS1_wGsqsies1ZwOiVL91wjVWicNZXCekiFx3Q">
<div class="absolute inset-0 bg-gradient-to-t from-primary/85 via-primary/20 to-black/20"></div>
<!-- 100% Free Badge -->
<div class="absolute top-3 right-3 flex items-center space-x-1 bg-surface-container-lowest/90 backdrop-blur-sm text-primary px-3 py-1 rounded-full shadow-sm border border-surface-container">
<span class="material-symbols-outlined text-[16px] text-primary">eco</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider font-bold">100% Free</span>
</div>
<!-- Audio Prompt Floating Pill -->
<button class="absolute bottom-3 left-3 flex items-center space-x-2 bg-surface-container-lowest/95 backdrop-blur-sm px-3.5 py-1.5 rounded-full shadow-sm border border-surface-container active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px] text-primary">volume_up</span>
<span class="font-label-md text-label-md text-on-surface">बोलकर सुनें (Audio Help)</span>
</button>
</div>
<!-- Content Header: Logo & Branding -->
<div class="flex items-center space-x-3.5 my-4 px-1">
<div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center p-1 shadow-sm shrink-0 border border-outline-variant/30 overflow-hidden"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsx3J2gfkQ5B9pfNZv2mp56h3aYiDiLmdmrWIDU30K_JINylWBMzc5m4UJAPJcgWT4COTUZmDURbxJQcKkI0gcFviwgk3GuC3TmH8xK67QMNKwgtZ3NkrFMaNiCfoc_c5GrA-x5AvXnJAz4yISSVaQxxZXGNg_dU8m8d7XyNqAtBHNc28gbXyA2faiyuWk0E2Ev26f1R-voKy5bKyzc3KbEDMW5dAPsqT1z63beHuBe76z8ga9h2Fg" alt="KisanSetu Logo" class="w-full h-full object-contain"></div>
<div class="flex flex-col min-w-0">
<h1 class="font-headline-sm text-headline-sm text-on-surface leading-tight font-bold">Welcome to KisanSetu</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">AI-Powered Crop Health &amp; Agronomist Bridge</p>
</div>
</div>
<!-- Interactive Segmented Toggle Switch -->
<div class="w-full bg-surface-container p-1 rounded-2xl flex items-center mb-4 border border-outline-variant/40">
<button class="flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 bg-primary text-on-primary shadow-sm" id="tabRegister" onclick="setMode('register')" type="button">
      New Registration
    </button>
<button class="flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface" id="tabLogin" onclick="setMode('login')" type="button">
      Log In
    </button>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm space-y-4 border border-outline-variant/40">
<!-- Input 1: Full Name -->
<div class="space-y-1.5" id="nameFieldGroup">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="fullNameInput">
<span>Farmer Full Name</span>
<span class="text-primary font-label-sm text-label-sm font-semibold">Required</span>
</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-outline text-[20px] pointer-events-none">
          person
        </span>
<input class="w-full h-13 pl-11 pr-12 rounded-2xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 border border-transparent focus:border-primary/20 transition-all" id="fullNameInput" placeholder="e.g. Ramesh Patil" type="text">
<button aria-label="Voice input" class="absolute right-2 w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center text-primary active:scale-90 transition-transform" id="voiceBtn" onclick="toggleVoice()" type="button">
<span class="material-symbols-outlined text-[19px]">mic</span>
</button>
</div>
</div>
<!-- Input 2: Mobile Number -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="mobileInput">
<span>Mobile Number</span>
<span class="text-primary font-label-sm text-label-sm font-semibold">Direct Fast Link</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center space-x-1 bg-surface-container px-2 py-1.5 rounded-xl pointer-events-none border border-outline-variant/30">
<span class="text-[14px]">🇮🇳</span>
<span class="font-label-md text-label-md text-on-surface font-bold">+91</span>
</div>
<input class="w-full h-13 pl-22 pr-11 rounded-2xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 border border-transparent focus:border-primary/20 transition-all tracking-wider" id="mobileInput" maxlength="10" oninput="validatePhone(this)" placeholder="98765 43210" type="tel">
<span class="absolute right-3.5 material-symbols-outlined text-primary text-[22px] hidden" id="phoneVerified" style="font-variation-settings: 'FILL' 1;">
          check_circle
        </span>
</div>
</div>
<!-- Helper Callout Banner -->
<div class="flex items-center space-x-2.5 bg-secondary-container/50 text-on-secondary-container p-3 rounded-xl border border-secondary-container">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0" style="font-variation-settings: 'FILL' 1;">
        bolt
      </span>
<p class="font-body-sm text-body-sm leading-tight text-on-surface-variant">
        No OTP or password required. Easy direct entry for fast field diagnostics.
      </p>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center space-x-2 shadow-md active:scale-[0.99] transition-all hover:bg-primary-container" id="submitCta" type="button" style="background-color: rgb(21, 87, 36);"><span>Continue</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
</div>
<!-- Trust & Offline Security Badges -->
<div class="mt-5 space-y-2 px-1">

<div class="flex items-center justify-center space-x-2 pt-1 text-outline">
<span class="material-symbols-outlined text-[14px] text-outline">lock</span>
<p class="font-body-sm text-[11px] text-on-surface-variant">Farm data stays secure on your device</p>
</div>
</div>
</div>
<script>
  function setMode(mode) {
    const regTab = document.getElementById('tabRegister');
    const logTab = document.getElementById('tabLogin');
    const nameField = document.getElementById('nameFieldGroup');
    const ctaText = document.getElementById('submitCta').querySelector('span');

    if (mode === 'register') {
      regTab.className = "flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 bg-primary text-on-primary shadow-sm";
      logTab.className = "flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface";
      nameField.style.display = 'block';
      ctaText.textContent = 'Continue to Florax AI';
    } else {
      logTab.className = "flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 bg-primary text-on-primary shadow-sm";
      regTab.className = "flex-1 py-2.5 rounded-xl font-label-md text-label-md text-center transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface";
      nameField.style.display = 'none';
      ctaText.textContent = 'Log In with Number';
    }
  }

  function validatePhone(input) {
    const cleaned = input.value.replace(/\D/g, '');
    input.value = cleaned;
    const badge = document.getElementById('phoneVerified');
    if (cleaned.length === 10) {
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function toggleVoice() {
    const btn = document.getElementById('voiceBtn');
    btn.classList.add('animate-pulse', 'bg-secondary-fixed-dim');
    setTimeout(() => {
      document.getElementById('fullNameInput').value = 'Ramesh Patil';
      btn.classList.remove('animate-pulse', 'bg-secondary-fixed-dim');
    }, 1200);
  }
</script></main>




</body></html>
