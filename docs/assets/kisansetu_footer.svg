<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-label="KisanSetu Footer Banner">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D3B1E" />
      <stop offset="50%" stop-color="#155724" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="footerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="100" rx="14" ry="14" />
    </clipPath>
    <style>
      .footer-wave {
        animation: footerDrift 12s ease-in-out infinite alternate;
      }
      .footer-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #FFFFFF;
        letter-spacing: 0.3px;
      }
      @keyframes footerDrift {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-70px); }
      }
    </style>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="1200" height="100" fill="url(#footerBg)" />
    <g class="footer-wave">
      <path d="M-40,34 C220,4 440,56 680,26 C920,-2 1100,48 1280,20 L1280,105 L-40,105 Z" fill="#4ADE80" fill-opacity="0.14" />
    </g>
    <path d="M0,20 Q300,38 600,18 T1200,24" fill="none" stroke="url(#footerGold)" stroke-width="1.8" stroke-opacity="0.65" />
    <rect x="0" y="96" width="1200" height="4" fill="url(#footerGold)" />
    <text x="600" y="61" text-anchor="middle" class="footer-text">KisanSetu • Offline-First Edge AI for Indian Smallholder Farmers • Srujan 2026</text>
  </g>
</svg>
